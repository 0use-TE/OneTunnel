<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="OneTunnel，将 Clash、WireGuard 和 Tailscale 放在一个安卓应用里。查看真实界面，按你的规则连接。">
  <meta property="og:type" content="website">
  <meta property="og:title" content="OneTunnel · 你的网络，一个入口">
  <meta property="og:description" content="Clash、WireGuard、Tailscale，统一连接。">
  <meta property="og:url" content="{{SITE_URL}}">
  <link rel="canonical" href="{{SITE_URL}}">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
  <title>OneTunnel · 你的网络，一个入口</title>
</head>
<body>
  <a class="skip-link" href="#main">跳到正文</a>
  <header class="header wrap">
    <a class="brand" href="#" aria-label="OneTunnel 首页"><img src="assets/logo.svg" width="34" height="34" alt=""><span>OneTunnel</span></a>
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="切换深色主题" aria-pressed="false">
      <svg class="moon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M20.2 14.2A8.5 8.5 0 0 1 9.8 3.8 8.5 8.5 0 1 0 20.2 14.2Z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
      <span id="theme-label">深色</span>
    </button>
  </header>
  <main id="main" class="wrap">
    <section class="intro" aria-labelledby="hero-title">
      <h1 id="hero-title">你的网络，<span>一个入口。</span></h1>
      <p class="protocols">Clash · WireGuard · Tailscale</p>
      <div class="intro-actions">
        <a class="button" href="https://github.com/0use-TE/OneTunnel">前往 GitHub</a>
        <span>Android {{ANDROID_MIN}}+ · ARM64</span>
      </div>
    </section>
    <section class="gallery" aria-label="OneTunnel 实机界面">
      <div class="tabs" role="tablist" aria-label="查看软件界面">
        <button id="tab-connections" role="tab" type="button" aria-selected="true" aria-controls="screen-panel" tabindex="0" data-screen="connections">连接</button>
        <button id="tab-proxies" role="tab" type="button" aria-selected="false" aria-controls="screen-panel" tabindex="-1" data-screen="proxies">代理组</button>
        <button id="tab-rules" role="tab" type="button" aria-selected="false" aria-controls="screen-panel" tabindex="-1" data-screen="rules">分流规则</button>
        <button id="tab-forwarding" role="tab" type="button" aria-selected="false" aria-controls="screen-panel" tabindex="-1" data-screen="forwarding">端口转发</button>
      </div>
      <figure id="screen-panel" role="tabpanel" aria-labelledby="tab-connections" tabindex="0">
        <figcaption id="screen-description">三种连接，统一管理。</figcaption>
        <a class="screenshot-link" id="screenshot-link" href="assets/screenshots/connections-light.webp" target="_blank" rel="noopener" aria-label="查看连接页面原图">
          <img id="app-screenshot" src="assets/screenshots/connections-light.webp" width="1751" height="1967" alt="OneTunnel 连接页面，分别管理订阅、WireGuard 和 Tailscale。" fetchpriority="high">
        </a>
      </figure>
    </section>
  </main>
  <footer class="footer wrap"><span>OneTunnel</span><div><a href="https://github.com/0use-TE/OneTunnel/blob/main/LICENSE">GPL-3.0</a><span>基于 Mihomo</span></div></footer>
</body>
</html>
